name: Container release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boxeu-release-${{ github.ref }}
  # Finish a scanned publication atomically; a newer push replaces pending work.
  cancel-in-progress: false
env:
  SOURCE_REPOSITORY: ${{ github.repository }}
  SOURCE_REVISION: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  BOXEU_BUILDX_CACHE: 'true'
jobs:
  checks:
    name: Application and source checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision and reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/source-application
  gate:
    name: Security gate
    needs: checks
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require the default branch and successful read-only checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          test "$CHECKS_RESULT" = success
      - name: Check out the exact revision and reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/security-setup
        with:
          scope: images
      - name: Build the exact candidates and freshly scan every image
        run: |
          python3 scripts/ci-images.py build
          python3 scripts/ci-images.py scan
      - name: Authenticate publication only after every gate passes
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only this run's scanned image identities
        run: python3 scripts/ci-images.py publish
  reject-ref:
    name: Release reference guard
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require main for publication; use Container verification for other refs
        run: test "$SOURCE_REF" = refs/heads/main
